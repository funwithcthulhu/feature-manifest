[package]
name = "feature-manifest"
version = "0.1.0"
edition = "2024"
description = "Document, validate, and render Cargo feature metadata."

[[bin]]
name = "cargo-feature-manifest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
