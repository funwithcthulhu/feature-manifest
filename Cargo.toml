[package]
name = "feature-manifest"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Document, validate, and render Cargo feature metadata."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/funwithcthulhu/feature-manifest"
homepage = "https://github.com/funwithcthulhu/feature-manifest"
documentation = "https://docs.rs/feature-manifest"
keywords = ["cargo", "features", "metadata", "docs", "cli"]
categories = ["development-tools", "development-tools::cargo-plugins"]

[[bin]]
name = "cargo-feature-manifest"
path = "src/main.rs"

[[bin]]
name = "cargo-fm"
path = "src/bin/cargo-fm.rs"

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1.0.102"
cargo_metadata = "0.20.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
toml_edit = "0.25.11"

[dev-dependencies]
tempfile = "3.27.0"
