[package]
name = "workspace-selection-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", optional = true }

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
internal-cache = []

[package.metadata.feature-manifest.features]
std = { description = "Enable the standard library surface.", category = "runtime" }
serde = { description = "Enable serialization for shared data types.", category = "serialization" }
internal-cache = { description = "Internal cache instrumentation.", public = false, category = "internal" }
