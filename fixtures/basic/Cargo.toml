[package]
name = "feature-manifest-fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", optional = true }
tokio = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
tokio = ["dep:tokio", "std"]
docs-preview = ["serde", "tokio?/rt"]
std = []
rustls = []
native-tls = []
unstable = []
internal-codegen = []

[package.metadata.feature-manifest.features]
serde = { description = "Enables Serialize/Deserialize impls.", category = "serialization", since = "0.1.0", docs = "https://docs.rs/serde" }
tokio = { description = "Enables async APIs backed by Tokio." }
docs-preview = { description = "Generates docs | preview output.\nIncludes async examples.", category = "docs", since = "0.2.0", docs = "https://docs.rs/feature-manifest", tracking_issue = "https://github.com/funwithcthulhu/feature-manifest/issues/1", requires = ["serde"], note = "Escapes table cells and Mermaid labels." }
std = { description = "Enables the standard library surface." }
rustls = { description = "Use rustls for TLS." }
native-tls = { description = "Use the system TLS stack.", deprecated = true }
unstable = { description = "Experimental APIs; semver not guaranteed.", unstable = true }
internal-codegen = { description = "Internal codegen support.", public = false }

[[package.metadata.feature-manifest.groups]]
name = "tls"
description = "Select one TLS backend."
members = ["rustls", "native-tls"]
mutually_exclusive = true
