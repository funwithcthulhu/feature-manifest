[package]
name = "feature-manifest-edge-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde1 = { package = "serde", version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
renamed-serde = ["dep:serde1"]
unix-ffi = ["dep:libc"]
flat-only = []
structured-only = ["renamed-serde"]

[package.metadata.feature-manifest]
preset = "adopt"
flat-only = { description = "Metadata declared in the flat layout.", category = "layout" }

[package.metadata.feature-manifest.features]
renamed-serde = { description = "Uses a renamed optional dependency.", category = "dependencies" }
unix-ffi = { description = "Uses a target-specific optional dependency.", category = "platform" }
structured-only = { description = "Metadata declared in the structured layout.", category = "layout" }
